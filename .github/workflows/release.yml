name: Release v1 (Linux, latest Go)

permissions:
  contents: write

on:
  push:
    tags:
      - "v1.*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v1.4.13"
        required: true
        default: "v1.4.13"

jobs:
  build:
    name: build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: ./web
        run: npm ci && VITE_VERSION=${{ inputs.version || github.ref_name }} npm run build

      - name: Setup Go (latest)
        uses: actions/setup-go@v5
        with:
          go-version: latest
          cache: true
          cache-dependency-path: go.sum

      - name: Build backend linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod download
          go build -trimpath \
            -ldflags "-s -w -X gpt-load/internal/version.Version=${{ inputs.version || github.ref_name }}" \
            -o gpt-load-linux-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: gpt-load-linux-${{ matrix.goarch }}
          path: |
            gpt-load-linux-${{ matrix.goarch }}
            web/dist
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: artifacts/**
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
